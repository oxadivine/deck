<style>

body{margin:0;background:var(--bg);color:var(--tx);font:500 13px/1.3 Oxanium,system-ui,sans-serif;user-select:none;-webkit-user-select:none}
header{display:flex;flex-direction:column;gap:6px;padding:8px 10px 0}
#spec{width:100%;height:90px;background:#050507;border:1px solid var(--ln);border-radius:8px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--dm);font-size:12px}
main{display:grid;grid-template-columns:1fr 190px 1fr;gap:10px;padding:10px;max-width:1200px;margin:auto}
.dk,.mix{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:10px;--c:#ff9f1c}
.top{display:flex;gap:8px;align-items:center;margin-bottom:6px}.top b{color:var(--c);font-size:16px}
.nm{flex:1;color:var(--dm);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.sm{background:#1c1f26;border:1px solid var(--ln);border-radius:6px;padding:5px 8px;cursor:pointer}
.wf{width:100%;height:64px;background:#050507;border-radius:6px;display:block;cursor:pointer}
.mid{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:8px 0}
.eqs{display:flex;flex-direction:column;gap:6px}
.jog{width:min(100%,260px);aspect-ratio:1;touch-action:none;cursor:grab;flex:1;max-width:260px}
.tp{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dm);font-size:10px}
.v{writing-mode:vertical-lr;direction:rtl;width:28px;height:190px;accent-color:var(--c)}

.row{display:flex;gap:6px;margin:6px 0;align-items:center}.row .k{flex:1}
.k{background:#1c1f26;border:1px solid var(--ln);border-radius:6px;padding:10px 4px 8px;position:relative;cursor:pointer;font-weight:700}
.k i{position:absolute;top:2px;right:4px;font:600 9px Oxanium,sans-serif;color:var(--dm);font-style:normal}
.k.on{background:var(--c);color:#000}.k.dn{filter:brightness(1.5)}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pad{height:50px;background:var(--p);color:#000;border:0;border-radius:8px}.pad i{color:#000a}
.pad.dn{transform:scale(.95)}
.k.sel{outline:2px dashed #fff}body.bind [data-act]{outline:1px dashed #667}
.mix{--c:#35e07a;display:flex;flex-direction:column;align-items:center;gap:10px}
.fd{display:flex;gap:12px}.fd div{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--dm)}
.mix .v{height:170px}.xf{width:150px;accent-color:#fff}
.xk{display:flex;gap:4px;width:100%}.xk .k{flex:1;padding:8px 2px}
#bind{background:#1c1f26;border:1px solid var(--ln);border-radius:6px;padding:6px 10px;cursor:pointer}body.bind #bind{background:#fff;color:#000}
.yr{display:none;gap:6px;margin-bottom:6px}.yr.o{display:flex}
.yi{flex:1;min-width:0;background:#050507;border:1px solid var(--ln);color:var(--tx);border-radius:6px;padding:6px 8px;font:inherit;user-select:text;-webkit-user-select:text}
.ytp{display:none;width:100%;height:200px;margin:6px 0;border-radius:6px;overflow:hidden;background:#000}.ytm .ytp{display:block}
.ytm .eqs,.ytm .amt,.ytm [data-act$=_echo],.ytm [data-act$=_flan],.ytm [data-act$=_rev],.ytm [data-act$=_filt]{opacity:.25;pointer-events:none}
@media(max-width:900px){main{grid-template-columns:1fr}.mix{order:-1}}

initJog(){const c=this.jog,dk=this;let drag=false,last=0,timer,was;

x.lineWidth=1;x.strokeStyle='#1d2027';for(let r=90;r<235;r+=14){x.beginPath();x.arc(m,m,r,0,7);x.stroke()}
x.lineWidth=14;x.strokeStyle=col;x.lineCap='round';for(let k=0;k<3;k++){x.beginPath();x.arc(m,m,222,th+k*2.094,th+k*2.094+.7);x.stroke()}
x.beginPath();x.arc(m,m,105,0,7);x.fillStyle='#14161b';x.fill();x.lineWidth=3;x.strokeStyle='#2a2e37';x.stroke();
x.strokeStyle='#fff';x.lineWidth=5;x.beginPath();x.moveTo(m+120*Math.cos(th),m+120*Math.sin(th));x.lineTo(m+190*Math.cos(th),m+190*Math.sin(th));x.stroke();
x.fillStyle='#fff';x.textAlign='center';x.font='700 44px Oxanium,sans-serif';x.fillText(this.yt?this.rate.toFixed(2)+'x':this.buf?(this.base*this.rate).toFixed(1):'--',m,m+6);x.font='500 22px Oxanium,sans-serif';x.fillStyle=col;x.fillText(this.yt?'YT':'BPM',m,m+36);
const w=this.wf,y=w.getContext('2d'),W=w.width,H=w.height;y.clearRect(0,0,W,H);if(this.yt){let d=0;try{d=this.yt.getDuration()}catch(e){}if(d>0){const f=clamp(this.t/d,0,1);y.fillStyle='#4a505c';y.fillRect(0,H/2-4,W,8);y.fillStyle=col;y.fillRect(0,H/2-4,f*W,8);y.fillStyle='#fff';y.fillRect(f*W-1,0,2,H);this.hc.forEach((h,i)=>{if(h!=null){y.fillStyle=HC[i];y.fillRect(h/d*W-1,0,4,H)}})}return}if(!this.buf)return;
const n=this.peaks.length,fr=this.t/this.buf.duration;
for(let i=0;i<n;i++){const h=this.peaks[i]*H*.9;y.fillStyle=i/n<fr?col:'#4a505c';y.fillRect(i/n*W,(H-h)/2,W/n-1,h)}
y.fillStyle='#fff';y.fillRect(fr*W-1,0,2,H);this.hc.forEach((h,i)=>{if(h!=null){y.fillStyle=HC[i];y.fillRect(h/this.buf.duration*W-1,0,4,H)}})}}

const D={};

s.innerHTML=`<div class="top"><b>DECK ${id}</b><span class="nm">Nicio piesă încărcată</span><button class="sm">Încarcă piesă</button><input type="file" accept="audio/*" hidden><button class="sm yb">YouTube</button></div>

<div class="mid"><div class="eqs"></div><canvas class="jog" width="520" height="520"></canvas><div class="tp"><input type="range" class="v" min="-16" max="16" step=".1" value="0">TEMPO</div></div>
<div class="row">${[['echo','ECHO'],['flan','FLANGER'],['rev','REVERB'],['filt','FILTER']].map(([a,l])=>btn(id+'_'+a,l)).join('')}<div class="amt"></div></div>

let xf=.5,fa=1,fb=1;
let mv=.8;const mixUpd=()=>{const ga=fa*Math.cos(xf*Math.PI/2),gb=fb*Math.sin(xf*Math.PI/2);D.A.ch.gain.value=ga;D.B.ch.gain.value=gb;D.A.ytVol(ga);D.B.ytVol(gb)};
$('#mix').innerHTML=`<b>MIXER</b><div class="fd"><div><input type="range" class="v" id="fa" min="0" max="1" step=".01" value="1">CH A</div><div><input type="range" class="v" id="fb" min="0" max="1" step=".01" value="1">CH B</div><div><input type="range" class="v" id="fm" min="0" max="1" step=".01" value=".8">MASTER</div></div>
<div>CROSSFADER</div><input type="range" class="xf" id="xf" min="0" max="1" step=".01" value=".5"><div class="xk">${btn('X_L','A ◀')}${btn('X_C','◎')}${btn('X_R','▶ B')}</div>`;
$('#fa').oninput=e=>{fa=+e.target.value;mixUpd()};$('#fb').oninput=e=>{fb=+e.target.value;mixUpd()};$('#fm').oninput=e=>{master.gain.value=mv=+e.target.value;mixUpd()};
$('#xf').oninput=e=>{xf=+e.target.value;mixUpd()};mixUpd();

function act(a,down,e){const[d,k]=a.split('_'),el=document.querySelector(`[data-act=${a}]`);el&&el.classList.toggle('dn',down);
if(d=='X'){if(down){xf=k=='L'?0:k=='R'?1:.5;$('#xf').value=xf;mixUpd()}return}
const dk=D[d];if(k=='play'){if(down)dk.toggle()}else if(k=='cue')down?dk.cueDown():dk.cueUp();
else if(k[0]=='h'){if(down)dk.hot(+k[1]-1,e&&e.shiftKey)}else if(k[0]=='s'){if(down)sfx(SN[+k[1]-1])}else if(down)dk.toggleFx(k)}
let bind=false,sel=null,held=null;
const save=()=>{try{localStorage.setItem('djkeys',JSON.stringify(KEYS))}catch(e){}};
function paint(){document.querySelectorAll('[data-act]').forEach(b=>{b.querySelector('i').textContent=lab(KEYS[b.dataset.act]);b.classList.toggle('sel',b===sel)})}
$('#bind').onclick=()=>{bind=!bind;sel=null;document.body.classList.toggle('bind',bind);$('#hint').textContent=bind?'Apasă un buton sau un pad, apoi tasta dorită. Backspace șterge tasta, Esc anulează.':'Trage de disc ca să faci scratch · Shift+click pe un hot cue îl șterge · Dublu-click pe buton rotativ îl resetează';paint()};
document.addEventListener('pointerdown',e=>{if(AC.state!='running')AC.resume();const b=e.target.closest('[data-act]');if(!b)return;if(bind){sel=b;paint();return}held=b;act(b.dataset.act,true,e)});
addEventListener('pointerup',()=>{if(held){act(held.dataset.act,false);held=null}});
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT'&&e.target.type=='text')return;if(AC.state!='running')AC.resume();
if(sel){e.preventDefault();if(e.code!='Escape'){const a=sel.dataset.act;if(e.code!='Backspace')for(const o in KEYS)if(KEYS[o]==e.code)KEYS[o]='';KEYS[a]=e.code=='Backspace'?'':e.code;save()}sel=null;paint();return}
if(bind||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;const a=Object.keys(KEYS).find(x=>KEYS[x]==e.code);if(a){e.preventDefault();act(a,true,e)}});
addEventListener('keyup',e=>{if(e.target.tagName=='INPUT'&&e.target.type=='text')return;if(bind)return;const a=Object.keys(KEYS).find(x=>KEYS[x]==e.code);if(a)act(a,false)});
paint();

const sc=$('#spec'),sx=sc.getContext('2d'),fd=new Uint8Array(an.frequencyBinCount);
(function loop(){an.getByteFrequencyData(fd);const W=sc.width,H=sc.height,n=100,bw=W/(2*n);sx.clearRect(0,0,W,H);
for(let i=0;i<n;i++){const h=Math.max(2,fd[i]/255*H);sx.fillStyle=`hsl(${i/n*300},100%,55%)`;sx.fillRect(W/2+i*bw,(H-h)/2,bw-1,h);sx.fillRect(W/2-(i+1)*bw,(H-h)/2,bw-1,h)}
D.A.draw();D.B.draw();requestAnimationFrame(loop)})();
